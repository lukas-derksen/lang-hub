name: Deploy content server

# Deploys server/ (a Cloudflare Worker) when it changes on main, or by hand
# (Actions → Deploy content server → Run workflow). On the first run it creates
# the D1 database and the KV namespace. Needs these repository secrets:
# CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, ANTHROPIC_API_KEY,
# ELEVENLABS_TTS_KEY, LANGHUB_APP_TOKEN.

on:
  push:
    branches: [main]
    paths: ['server/**', 'js/recommend.js', 'content/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets are set
        id: check
        working-directory: .
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          E: ${{ secrets.ELEVENLABS_TTS_KEY }}
          T: ${{ secrets.LANGHUB_APP_TOKEN }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$A" ] || missing+=(ANTHROPIC_API_KEY)
          [ -n "$E" ] || missing+=(ELEVENLABS_TTS_KEY)
          [ -n "$T" ] || missing+=(LANGHUB_APP_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Not deploying: missing repository secrets: ${missing[*]}"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          elif [ ${#T} -lt 16 ]; then
            echo "::error::LANGHUB_APP_TOKEN must be at least 16 characters (32 or more recommended)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != '1'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: 22

      - name: Install
        if: steps.check.outputs.skip != '1'
        run: npm ci

      - name: Type check and tests
        if: steps.check.outputs.skip != '1'
        run: npx tsc --noEmit && npm test

      - name: Create the database and audio store (first run only)
        if: steps.check.outputs.skip != '1'
        run: |
          set -euo pipefail
          d1() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="lang-hub") | .uuid'; }
          kv() { npx wrangler kv namespace list | jq -r '.[] | select(.title=="lang-hub-audio" or (.title|endswith("-lang-hub-audio"))) | .id' | head -n1; }
          D1=$(d1); if [ -z "$D1" ]; then npx wrangler d1 create lang-hub > /dev/null; D1=$(d1); fi
          KV=$(kv); if [ -z "$KV" ]; then npx wrangler kv namespace create lang-hub-audio > /dev/null; KV=$(kv); fi
          [ -n "$D1" ] && [ -n "$KV" ] || { echo "::error::Could not find or create the D1 database or KV namespace."; exit 1; }
          sed -i "s/__D1_ID__/$D1/; s/__KV_ID__/$KV/" wrangler.toml

      - name: Apply database migrations
        if: steps.check.outputs.skip != '1'
        run: npx wrangler d1 migrations apply lang-hub --remote

      - name: Deploy
        if: steps.check.outputs.skip != '1'
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set secrets
        if: steps.check.outputs.skip != '1'
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          E: ${{ secrets.ELEVENLABS_TTS_KEY }}
          T: ${{ secrets.LANGHUB_APP_TOKEN }}
        run: jq -n --arg a "$A" --arg e "$E" --arg t "$T" '{ANTHROPIC_API_KEY:$a, ELEVENLABS_TTS_KEY:$e, APP_TOKEN:$t}' | npx wrangler secret bulk

      - name: Summary
        if: steps.check.outputs.skip != '1'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### Content server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Server address for the app's Settings: **${URL:-see the Deploy step log}**" >> "$GITHUB_STEP_SUMMARY"
