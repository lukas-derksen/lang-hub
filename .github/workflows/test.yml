name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Unit tests
        # Node 22 treats arguments as file globs, so a bare `tests/` directory isn't expanded.
        run: node --test tests/*.test.mjs
