    <a href="#/listen" data-tab="listen"><span class="ico">🎧</span><span>Listen</span></a>
    <a href="#/read" data-tab="read"><span class="ico">📖</span><span>Read</span></a>
    <a href="#/review" data-tab="review"><span class="ico">✎</span><span>Review</span></a>

  <script type="module" src="js/app.js"></script>
